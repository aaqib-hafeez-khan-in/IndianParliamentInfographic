<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ea580c">
  <title>Page not found · Indian Parliament Infographic</title>
  <style>
    :root { --bg: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #64748b; --accent: #ea580c; --border: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(620px, 100%); padding: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(15, 23, 42, .1); text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, #ea580c, #c2410c); color: #fff; font-weight: 800; font-size: 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 56px); letter-spacing: -.05em; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 auto 28px; max-width: 500px; color: var(--muted); line-height: 1.7; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; }
    a:hover { background: #c2410c; }
    .tricolor { height: 3px; margin: 28px 0 0; border-radius: 99px; background: linear-gradient(to right, #ff9933 33%, #fff 33%, #fff 66%, #138808 66%); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">IP</div>
    <h1>404</h1>
    <h2>That page doesn't exist.</h2>
    <p>The requested Parliament Infographic page could not be found. Return to the explorer to continue browsing the available views.</p>
    <a href="/IndianParliamentInfographic/">Back to the Parliament explorer</a>
    <div class="tricolor" aria-hidden="true"></div>
  </main>
</body>
</html>
